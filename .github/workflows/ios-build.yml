name: iOS build check (Simulator)

# Compiles the never-built native app on a free macOS runner and uploads the
# .app bundle so it can be dragged into Appetize.io (or any Simulator) for a
# look at the UI. This is a SIMULATOR build — it needs no Apple Developer
# account and no code signing, but it therefore also cannot exercise
# NearbyInteraction (UWB bump), Core Motion (shake/knock), or Core Haptics,
# none of which the Simulator implements. See ios-native/README.md's "First
# build watchlist" — this is expected to go red a few times before it's
# green; read the job log for the exact file/line and fix forward.

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios-native/**'
      - '.github/workflows/ios-build.yml'

jobs:
  build-simulator:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios-native
    env:
      # The macos-15 runner image ships with an untrusted `aws/tap` already
      # tapped. Recent Homebrew refuses to install ANYTHING — even an
      # unrelated formula like xcodegen — while any untrusted tap is present,
      # unless this is set. Nothing here installs from that tap; this only
      # turns off the blanket refusal.
      HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Placeholder secrets (build-only — no real backend calls happen in a Simulator compile check)
        run: cp Sources/Config/Secrets.example.xcconfig Sources/Config/Secrets.xcconfig

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          # 2>&1 matters: the previous run died right after "Resolved source
          # packages" with nothing useful in build.log, because whatever
          # killed it printed to stderr and only stdout was going into the
          # pipe below — the real reason was never captured. Merging stderr
          # in fixes that. The two -skip... flags bypass the interactive
          # "trust this package plugin/macro" prompt that SPM plugins (a few
          # of these dependency trees use them) throw in non-interactive CI —
          # a very common cause of exactly this "stops dead after resolving
          # packages" symptom.
          # A concrete device destination (name:'iPhone 16') failed because
          # the runner's selected Xcode didn't have a matching simulator
          # runtime installed — which specific devices/runtimes are
          # pre-downloaded varies by image and changes over time. We don't
          # need to launch the app, only compile it, so `generic/platform=iOS
          # Simulator` (the "Any iOS Simulator Device" SDK, no specific
          # device/runtime required) is the right destination for a build-only
          # check and sidesteps that entirely.
          xcodebuild \
            -project Pinpop.xcodeproj \
            -scheme Pinpop \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            build \
          2>&1 | tee build.log \
          | xcpretty || (echo "---- full raw log ----" && cat build.log && exit 1)

      - name: Locate built .app
        if: success()
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "Pinpop.app" -path "*Debug-iphonesimulator*" | head -1)
          echo "Found: $APP_PATH"
          mkdir -p out
          cp -R "$APP_PATH" out/Pinpop.app

      - name: Zip .app for upload
        if: success()
        run: cd out && zip -r Pinpop-simulator.zip Pinpop.app

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Pinpop-simulator-app
          path: ios-native/out/Pinpop-simulator.zip
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: ios-native/build.log
          retention-days: 14
