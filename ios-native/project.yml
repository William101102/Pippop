# XcodeGen spec — generates Pinpop.xcodeproj
#
#   brew install xcodegen
#   cd ios-native && xcodegen generate && open Pinpop.xcodeproj
#
# Hand-written .xcodeproj files are unreviewable and break easily; this YAML is
# the source of truth. Regenerate after adding files — no manual target edits.
#
# IMPORTANT: `xcodegen generate` throws the whole .xcodeproj away and rebuilds
# it from this file. Anything set only through Xcode's UI — Signing &
# Capabilities' Team picker, a Configurations → xcconfig assignment, a
# capability toggled off — does NOT survive the next regenerate. Everything
# that setup screen walked you through now lives here instead, specifically
# so that stops being true.

name: Pinpop
options:
  bundleIdPrefix: com.pinpop
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

# Wires Secrets.xcconfig (gitignored, per-developer) to both build
# configurations declaratively — this used to be a manual step in Xcode's
# Project → Info → Configurations screen, which `xcodegen generate` silently
# undoes every time it's run, because it isn't recorded anywhere this file
# can see. Now it is.
configFiles:
  Debug: Sources/Config/Secrets.xcconfig
  Release: Sources/Config/Secrets.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.9"
    # From Secrets.xcconfig (see Secrets.example.xcconfig) — a personal Team
    # ID isn't a secret exactly, but it's tied to one developer's Apple ID,
    # so it lives in the gitignored file with everything else per-developer
    # rather than being hardcoded here for whoever clones this repo next.
    DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # `complete` turns every delegate hop and singleton in this codebase into a
    # build error before you can run anything. Start at `minimal`, get a green
    # build, then tighten it deliberately.
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.5.1"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "7.1.0"

targets:
  Pinpop:
    type: application
    platform: iOS
    settings:
      base:
        # Every other identifier in this file (the URL scheme's
        # CFBundleURLName below, the App Group, the widget's own
        # com.pinpop.app.widgets) assumes the host app is com.pinpop.app.
        # Without setting it explicitly, xcodegen defaults an unset
        # PRODUCT_BUNDLE_IDENTIFIER to "<bundleIdPrefix>.<target name>" —
        # com.pinpop.Pinpop — which the widget's id doesn't start with, so
        # Xcode refuses to embed it ("Embedded binary's bundle identifier is
        # not prefixed with the parent app's bundle identifier").
        PRODUCT_BUNDLE_IDENTIFIER: com.pinpop.app
        # Belt and suspenders alongside the project-level DEVELOPMENT_TEAM
        # above — every target that needs signing sets it explicitly too, so
        # nothing depends on inheritance behaving a particular way.
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        # Sources/Resources/Assets.xcassets/AppIcon.appiconset. Xcode's own
        # default happens to be "AppIcon" too, but a generated project should
        # not lean on defaults — this is the only line tying the bundle to
        # that icon set. One 1024×1024 image is all it needs; Xcode derives
        # every home-screen/Settings/Spotlight size from it at build time.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    sources:
      - path: Sources
        excludes:
          # xcconfig is build configuration, not an app resource — without this
          # it gets copied into the bundle.
          - "Config/*.xcconfig"
    info:
      path: Sources/Config/Info.plist
      properties:
        CFBundleDisplayName: Pinpop
        CFBundleShortVersionString: $(MARKETING_VERSION)
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        # Live Activity / Dynamic Island
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true

        # --- Permission strings -------------------------------------------
        # App Review reads these. Be specific about the user benefit; vague
        # strings are a common 5.1.1 rejection.
        NSLocationWhenInUseUsageDescription:
          Pinpop shows you and your friends on a shared live map.
        NSLocationAlwaysAndWhenInUseUsageDescription:
          Pinpop keeps sharing your location with the friends you choose while
          the app is in the background, so their map stays live. You can switch
          to Blurred or Frozen, or turn sharing off, at any time.
        NSNearbyInteractionUsageDescription:
          Pinpop uses ultra-wideband to show the exact distance and direction to
          a nearby friend so you can find each other and bump to say hi.
        NSLocalNetworkUsageDescription:
          Pinpop discovers friends standing next to you to set up a bump.
        NSBluetoothAlwaysUsageDescription:
          Pinpop uses Bluetooth to find friends who are right next to you.
        NSMotionUsageDescription:
          Pinpop uses motion to detect a shake or a knock on the back of your
          phone as a shortcut for waving at friends.
        NSPhotoLibraryUsageDescription:
          Pick a photo for your avatar or a Highlight.
        NSCameraUsageDescription:
          Take a photo for your avatar or a Highlight.

        UIBackgroundModes:
          - location
          - remote-notification
        NSBonjourServices:
          - _pinpop-bump._tcp
          - _pinpop-bump._udp

        # Fredoka (display/headline) + DM Sans (body) — the exact families the
        # web app pulls from Google Fonts (`src/styles.css`'s @import). Static
        # weight instances sliced from the real variable fonts with
        # `fonttools varLib.instancer`, since neither family ships static .ttfs
        # and SwiftUI's `Font.custom(_:size:)` needs a fixed-weight file per
        # name — see Sources/Resources/Fonts/. Bundled files must be listed
        # here or CoreText never registers them at launch.
        UIAppFonts:
          - Fredoka-Medium.ttf
          - Fredoka-SemiBold.ttf
          - Fredoka-Bold.ttf
          - DMSans-Medium.ttf
          - DMSans-SemiBold.ttf
          - DMSans-Bold.ttf
          - DMSans-ExtraBold.ttf

        # --- Injected from Secrets.xcconfig (never committed) --------------
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        GIDClientID: $(GOOGLE_CLIENT_ID)

        CFBundleURLTypes:
          - CFBundleURLName: com.pinpop.app
            CFBundleURLSchemes: [pinpop]
          # Google's OAuth callback comes back on the reversed client ID.
          - CFBundleURLName: com.pinpop.app.google
            CFBundleURLSchemes: [$(GOOGLE_REVERSED_CLIENT_ID)]

    entitlements:
      path: Sources/Config/Pinpop.entitlements
      properties:
        # Sign In with Apple and Push Notifications are BOTH hard-unsupported
        # on a free/personal Apple Developer team — not a config bug, Apple's
        # own error is explicit: "Personal development teams... do not
        # support the Sign In with Apple and Push Notifications capabilities."
        # Previously these were removed by hand in Xcode's Signing &
        # Capabilities UI each time, which `xcodegen generate` then quietly
        # re-added on the next regenerate (since this file never stopped
        # declaring them) — that's what just broke the build again. Once
        # there's a paid Apple Developer Program membership on this team,
        # uncomment both lines below and regenerate.
        # com.apple.developer.applesignin: [Default]
        # aps-environment: development
        com.apple.security.application-groups:
          - group.com.pinpop.app

    dependencies:
      - package: Supabase
        product: Supabase
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
      - target: PinpopWidgets
        embed: true

    scheme:
      testTargets:
        - PinpopTests

  # Live Activity / Dynamic Island + the home-screen widget.
  PinpopWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      # Shared/ is compiled into BOTH targets — the activity attributes and
      # the snapshot format must be the same types on each side.
      - path: Sources/Shared
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Pinpop
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/PinpopWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.pinpop.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pinpop.app.widgets
        SKIP_INSTALL: YES
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)

  PinpopTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Pinpop
    settings:
      base:
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
